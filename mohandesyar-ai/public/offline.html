<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#082532" />
    <title>مهندس‌یار AI | حالت آفلاین</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 0,#184a54 0,transparent 32%),#082532;color:#fff;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,520px);padding:32px;border:1px solid #ffffff24;border-radius:24px;background:#ffffff0c;box-shadow:0 24px 70px #0004;backdrop-filter:blur(12px)}.mark{display:grid;place-items:center;width:64px;height:64px;border:1px solid #c9df5a;border-radius:20px 20px 20px 6px;color:#c9df5a;font-size:28px;font-weight:900}.eyebrow{margin:24px 0 8px;color:#c9df5a;font-size:12px;font-weight:800}.card h1{margin:0 0 14px;font-size:28px}.card p{margin:0;color:#c5d8db;line-height:2;font-size:14px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.actions a{padding:12px 16px;border-radius:12px;background:#c9df5a;color:#082532;text-decoration:none;font-size:13px;font-weight:900}.actions button{padding:12px 16px;border:1px solid #ffffff2a;border-radius:12px;background:transparent;color:#fff;font:inherit;cursor:pointer}.hint{display:block;margin-top:22px;color:#8fb0b5;font-size:11px;line-height:1.8}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">M</div>
      <p class="eyebrow">مهندس‌یار AI · حالت آفلاین</p>
      <h1>بدون اینترنت هم کنار شماست</h1>
      <p>صفحات و گزارش‌هایی که قبلاً باز کرده‌اید از حافظه امن همین دستگاه قابل دسترسی هستند. برای همگام‌سازی اطلاعات جدید، دوباره به اینترنت متصل شوید.</p>
      <div class="actions">
        <a href="/">بازگشت به داشبورد</a>
        <button type="button" onclick="location.reload()">بررسی اتصال</button>
      </div>
      <small class="hint">اطلاعات حساس در این صفحه ارسال یا بارگذاری نمی‌شود.</small>
    </main>
  </body>
</html>
