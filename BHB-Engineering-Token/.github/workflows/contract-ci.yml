name: Contract CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run contract tests
        run: npm test
