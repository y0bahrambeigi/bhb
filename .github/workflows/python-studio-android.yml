name: Build Python Studio Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'python-learning-studio-pro/**'
      - '.github/workflows/python-studio-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-learning-studio-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run mobile:prepare
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-studio-android-debug
          path: python-learning-studio-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
