name: Remove duplicate MohandesYar technical report author

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-duplicate-mohandesyar-author.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove duplicate Figshare author and verify DOI
        shell: python
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          import json, os, urllib.error, urllib.request

          article_id = 33935692
          duplicate_author_id = 24753196
          canonical_author_id = 24754576
          expected_doi = "10.6084/m9.figshare.33935692.v1"
          token = os.environ.get("FIGSHARE_TOKEN", "").strip()
          if not token:
              raise SystemExit("FIGSHARE_TOKEN missing.")

          url = f"https://api.figshare.com/v2/account/articles/{article_id}/authors/{duplicate_author_id}"
          req = urllib.request.Request(
              url,
              method="DELETE",
              headers={"Authorization": f"token {token}", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print("Duplicate-author delete HTTP:", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              raise SystemExit(f"Delete failed: HTTP {e.code}: {body}")

          public_url = f"https://api.figshare.com/v2/articles/{article_id}"
          with urllib.request.urlopen(public_url, timeout=60) as resp:
              data = json.load(resp)

          authors = data.get("authors") or []
          doi = data.get("doi") or ""
          citation = data.get("citation") or ""

          print("Public authors:", [(a.get("id"), a.get("full_name")) for a in authors])
          print("Public citation:", citation)
          print("Public DOI:", doi)

          if len(authors) != 1 or int(authors[0].get("id", -1)) != canonical_author_id:
              raise SystemExit("Duplicate author remains after delete.")
          if doi != expected_doi:
              raise SystemExit(f"DOI changed unexpectedly: {doi}")
