name: Fix MohandesYar technical report author metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-mohandesyar-technical-report-authors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Require Figshare API token
        shell: bash
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FIGSHARE_TOKEN}"

      - name: Replace duplicate authors with canonical Figshare author
        shell: python
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          import json, os, urllib.request

          article_id = 33935692
          canonical_author_id = 24754576
          token = os.environ["FIGSHARE_TOKEN"]
          url = f"https://api.figshare.com/v2/account/articles/{article_id}/authors"
          payload = json.dumps({"authors": [{"id": canonical_author_id}]}).encode()
          req = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"token {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print("Author replacement HTTP:", resp.status)

          public_url = f"https://api.figshare.com/v2/articles/{article_id}"
          with urllib.request.urlopen(public_url, timeout=60) as resp:
              data = json.load(resp)

          authors = data.get("authors") or []
          citation = data.get("citation") or ""
          doi = data.get("doi") or ""
          print("Public authors:", [(a.get("id"), a.get("full_name")) for a in authors])
          print("Public citation:", citation)
          print("Public DOI:", doi)

          if len(authors) != 1 or int(authors[0].get("id", -1)) != canonical_author_id:
              raise SystemExit("Canonical author replacement did not take effect.")
          if doi != "10.6084/m9.figshare.33935692.v1":
              raise SystemExit(f"Unexpected DOI after metadata correction: {doi}")
