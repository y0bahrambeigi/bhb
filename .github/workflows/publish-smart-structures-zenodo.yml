name: Archive Smart Structures RC1 on Zenodo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-smart-structures-zenodo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: "smart-structures-v1.0.0-rc1"
      VERSION: "1.0.0-rc1"
      TITLE: "سازه‌های هوشمند و کنترل پاسخ لرزه‌ای"
      RELEASE_URL: "https://github.com/y0bahrambeigi/bhb/releases/tag/smart-structures-v1.0.0-rc1"
      PDF_ASSET: "Smart_Structures_Yousef_Bahrambeigi_v1.0.0-rc1_digital.pdf"
      DOCX_ASSET: "Smart_Structures_Yousef_Bahrambeigi_v1.0.0-rc1_source.docx"
      CHECKSUM_ASSET: "SHA256SUMS"
      CFF_ASSET: "CITATION.cff"
      BIB_ASSET: "CITATION.bib"
      LICENSE_ASSET: "LICENSE.md"
      ORCID: "0000-0002-3421-8679"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zenodo_upload
          cd zenodo_upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$PDF_ASSET" \
            -p "$DOCX_ASSET" \
            -p "$CHECKSUM_ASSET" \
            -p "$CFF_ASSET" \
            -p "$BIB_ASSET" \
            -p "$LICENSE_ASSET"

          grep -E '(digital\.pdf|source\.docx)$' "$CHECKSUM_ASSET" | sha256sum -c -
          ls -lh

      - name: Guarded Zenodo publication
        id: zenodo
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ.get("ZENODO_TOKEN", "").strip()
          if not token:
              raise SystemExit("ZENODO_TOKEN is not configured; no Zenodo action was taken.")

          title = os.environ["TITLE"]
          version = os.environ["VERSION"]
          release_url = os.environ["RELEASE_URL"]
          upload_dir = Path("zenodo_upload")
          assets = [
              os.environ["PDF_ASSET"],
              os.environ["DOCX_ASSET"],
              os.environ["CHECKSUM_ASSET"],
              os.environ["CFF_ASSET"],
              os.environ["BIB_ASSET"],
              os.environ["LICENSE_ASSET"],
          ]
          orcid = os.environ["ORCID"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "Smart-Structures-Book-Zenodo-Publisher/1.0",
          }

          def request_json(url, method="GET", payload=None, raw=None, extra_headers=None, timeout=180):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              data = raw
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read()
                      parsed = json.loads(body.decode("utf-8")) if body else {}
                      return resp.status, parsed
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise SystemExit(f"Zenodo API {method} {url} failed HTTP {e.code}: {body}")

          status, deposits = request_json("https://zenodo.org/api/deposit/depositions?size=100")
          if status != 200 or not isinstance(deposits, list):
              raise SystemExit("Could not safely list existing Zenodo depositions.")

          matches = []
          for dep in deposits:
              md = dep.get("metadata") or {}
              if md.get("title") == title and str(md.get("version", "")) == version:
                  matches.append(dep)

          if len(matches) > 1:
              raise SystemExit(
                  f"Found {len(matches)} deposits with identical title+version; refusing duplicate publication."
              )

          if len(matches) == 1 and (matches[0].get("submitted") is True or matches[0].get("state") == "done"):
              dep = matches[0]
              doi = dep.get("doi") or (dep.get("metadata") or {}).get("doi")
              result = {
                  "status": "already-published",
                  "doi": doi,
                  "doi_url": dep.get("doi_url") or (f"https://doi.org/{doi}" if doi else None),
                  "record_url": dep.get("record_url") or (dep.get("links") or {}).get("record"),
                  "record_id": dep.get("record_id") or dep.get("id"),
              }
              Path("zenodo_result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              print(json.dumps(result, ensure_ascii=False, indent=2))
              sys.exit(0)

          if len(matches) == 1:
              dep = matches[0]
              print("Reusing existing unpublished draft:", dep.get("id"))
          else:
              create_status, dep = request_json(
                  "https://zenodo.org/api/deposit/depositions",
                  method="POST",
                  payload={},
              )
              if create_status != 201:
                  raise SystemExit(f"Unexpected draft create status {create_status}")
              print("Created Zenodo draft:", dep.get("id"))

          dep_id = dep["id"]
          metadata = {
              "metadata": {
                  "title": title,
                  "upload_type": "publication",
                  "publication_type": "book",
                  "description": (
                      "Digital release candidate of the Persian academic book "
                      "Smart Structures and Seismic Response Control. The package includes "
                      "a tagged Persian PDF, editable DOCX source, citation metadata, "
                      "integrity checksums, and an interactive offline-capable PWA in the "
                      "associated GitHub repository. This is release candidate 1; the "
                      "final v1.0.0 remains a separate publication milestone."
                  ),
                  "creators": [{
                      "name": "Bahrambeigi, Yousef",
                      "orcid": orcid,
                  }],
                  "publication_date": "2026-10-03",
                  "version": version,
                  "access_right": "open",
                  "license": "cc-by-4.0",
                  "language": "fas",
                  "keywords": [
                      "smart structures",
                      "structural control",
                      "seismic response control",
                      "base isolation",
                      "active control",
                      "digital twin",
                      "civil engineering"
                  ],
                  "related_identifiers": [{
                      "identifier": release_url,
                      "relation": "isIdenticalTo",
                      "scheme": "url"
                  }]
              }
          }

          update_status, dep = request_json(
              f"https://zenodo.org/api/deposit/depositions/{dep_id}",
              method="PUT",
              payload=metadata,
          )
          if update_status != 200:
              raise SystemExit(f"Unexpected metadata update status {update_status}")

          bucket = (dep.get("links") or {}).get("bucket")
          if not bucket:
              raise SystemExit("Zenodo draft did not expose a file bucket.")

          for filename in assets:
              path = upload_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Missing release asset: {filename}")
              target = bucket.rstrip("/") + "/" + urllib.parse.quote(filename)
              req = urllib.request.Request(
                  target,
                  data=path.read_bytes(),
                  headers={**headers, "Content-Type": "application/octet-stream"},
                  method="PUT",
              )
              try:
                  with urllib.request.urlopen(req, timeout=240) as resp:
                      if resp.status not in (200, 201):
                          raise SystemExit(f"Unexpected upload status {resp.status} for {filename}")
                      resp.read()
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise SystemExit(f"Upload failed for {filename}: HTTP {e.code}: {body}")
              print("Uploaded:", filename)

          _, dep = request_json(f"https://zenodo.org/api/deposit/depositions/{dep_id}")
          md = dep.get("metadata") or {}
          names = {
              f.get("filename") or f.get("name")
              for f in (dep.get("files") or [])
          }
          failures = []
          if md.get("title") != title:
              failures.append("title mismatch")
          if str(md.get("version", "")) != version:
              failures.append("version mismatch")
          if md.get("upload_type") != "publication":
              failures.append("upload type mismatch")
          for required in assets:
              if required not in names:
                  failures.append(f"missing file {required}")
          if failures:
              raise SystemExit("Publication gate failed: " + "; ".join(failures))

          reserved = (md.get("prereserve_doi") or {}).get("doi")
          print("Reserved DOI:", reserved)

          publish_url = (dep.get("links") or {}).get("publish") or \
              f"https://zenodo.org/api/deposit/depositions/{dep_id}/actions/publish"
          pub_status, published = request_json(publish_url, method="POST")
          if pub_status not in (200, 201, 202):
              raise SystemExit(f"Unexpected publish status {pub_status}")

          doi = published.get("doi") or (published.get("metadata") or {}).get("doi") or reserved
          result = {
              "status": "published",
              "doi": doi,
              "doi_url": published.get("doi_url") or (f"https://doi.org/{doi}" if doi else None),
              "record_url": published.get("record_url") or (published.get("links") or {}).get("record"),
              "record_id": published.get("record_id") or published.get("id") or dep_id,
          }
          Path("zenodo_result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("ZENODO_PUBLISH_SUCCESS")
          print(json.dumps(result, ensure_ascii=False, indent=2))

      - name: Verify DOI resolution
        shell: python
        run: |
          import json
          import urllib.request
          from pathlib import Path

          result = json.loads(Path("zenodo_result.json").read_text(encoding="utf-8"))
          doi = result.get("doi")
          if not doi:
              raise SystemExit("Zenodo result contains no DOI.")
          req = urllib.request.Request(
              f"https://doi.org/{doi}",
              headers={"User-Agent": "Smart-Structures-DOI-Verifier/1.0"}
          )
          with urllib.request.urlopen(req, timeout=90) as resp:
              resolved = resp.geturl()
              print("DOI:", doi)
              print("Resolved URL:", resolved)
              if "zenodo.org" not in resolved.lower():
                  raise SystemExit("DOI did not resolve to Zenodo.")

      - name: Add DOI to GitHub Release notes
        shell: bash
        run: |
          set -euo pipefail
          DOI="$(python -c 'import json; print(json.load(open("zenodo_result.json"))["doi"])')"
          DOI_URL="https://doi.org/$DOI"
          cat > /tmp/release-notes.md <<EOF
          ## Smart Structures v1.0.0-rc1

          نخستین نامزد انتشار دیجیتال کتاب «سازه‌های هوشمند و کنترل پاسخ لرزه‌ای» اثر یوسف بهرام بیگی.

          **Archival DOI:** $DOI_URL

          ### Included
          - منبع DOCX نسخه‌گذاری‌شده با فونت‌های فارسی جاسازی‌شده
          - PDF دیجیتال Tagged با زبان `fa-IR`
          - وب‌اپ/PWA تعاملی و آفلاین کتاب در مخزن
          - فراداده استناد `CITATION.cff` و `CITATION.bib`
          - مجوز CC BY 4.0 برای محتوای اصیل
          - `SHA256SUMS` برای کنترل تمامیت دارایی‌ها

          ### Release boundary
          این رکورد مربوط به **v1.0.0-rc1** است. نسخه نهایی `v1.0.0` یک milestone مستقل است و باید پس از همگام‌سازی DOI/فراداده در دارایی‌های نهایی منتشر شود.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md

      - name: Upload Zenodo result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-structures-zenodo-result
          path: zenodo_result.json
          if-no-files-found: warn
