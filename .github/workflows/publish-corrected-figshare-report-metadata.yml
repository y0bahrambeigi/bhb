name: Publish corrected Figshare metadata version

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-corrected-figshare-report-metadata.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify corrected author and publish metadata revision
        shell: python
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          import json, os, urllib.error, urllib.request

          article_id = 33935692
          canonical_author_id = 24754576
          token = os.environ.get("FIGSHARE_TOKEN", "").strip()
          if not token:
              raise SystemExit("FIGSHARE_TOKEN missing.")

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/json",
          }

          def get(url, auth=True):
              req = urllib.request.Request(
                  url,
                  headers=(headers if auth else {"Accept": "application/json"}),
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.load(resp)

          private = get(f"https://api.figshare.com/v2/account/articles/{article_id}")
          authors = private.get("authors") or []
          if len(authors) != 1 or int(authors[0].get("id", -1)) != canonical_author_id:
              raise SystemExit(f"Refusing publish: account-side authors are not canonical: {authors}")

          before_version = int(private.get("version") or 0)
          print("Account-side author metadata is canonical.")
          print("Current version:", before_version)

          req = urllib.request.Request(
              f"https://api.figshare.com/v2/account/articles/{article_id}/publish",
              data=b"",
              method="POST",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  print("Publish HTTP:", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              if e.code not in (400, 409):
                  raise
              print(f"Publish returned HTTP {e.code}: {body}")
              raise SystemExit("Could not safely publish corrected metadata revision.")

          public = get(f"https://api.figshare.com/v2/articles/{article_id}", auth=False)
          print("Public version:", public.get("version"))
          print("Public DOI:", public.get("doi"))
          print("Public authors:", [(a.get("id"), a.get("full_name")) for a in (public.get("authors") or [])])
          print("Public citation:", public.get("citation"))
