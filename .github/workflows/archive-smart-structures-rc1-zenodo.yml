name: Smart Structures RC1 Zenodo read-only preflight

on:
  push:
    branches: [ops/rc1-zenodo-preflight-20261026]
    paths: [.github/workflows/archive-smart-structures-rc1-zenodo.yml]
  workflow_dispatch:

concurrency:
  group: smart-structures-rc1-zenodo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: "smart-structures-v1.0.0-rc1"
      VERSION: "1.0.0-rc1"
      TITLE: "سازه‌های هوشمند و کنترل پاسخ لرزه‌ای"
      RELEASE_URL: "https://github.com/y0bahrambeigi/bhb/releases/tag/smart-structures-v1.0.0-rc1"
      PDF_ASSET: "Smart_Structures_Yousef_Bahrambeigi_v1.0.0-rc1_digital.pdf"
      DOCX_ASSET: "Smart_Structures_Yousef_Bahrambeigi_v1.0.0-rc1_source.docx"
      PRINT_ASSET: "Smart_Structures_Yousef_Bahrambeigi_v1.0.0-rc1_print-candidate.pdf"
      CHECKSUM_ASSET: "SHA256SUMS"
      LICENSE_ASSET: "LICENSE.md"
      ORCID: "0000-0002-3421-8679"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Zenodo credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ZENODO_TOKEN:-}" ]; then
            echo "::error::ZENODO_TOKEN is not configured. No Zenodo action was taken."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate webapp before archival publication
        shell: bash
        run: |
          set -euo pipefail
          node --check publications/smart-structures/webapp/app.js
          node --check publications/smart-structures/webapp/calculations.js
          node --check publications/smart-structures/webapp/sw.js
          node publications/smart-structures/webapp/tests/validate.mjs

      - name: Download and verify exact GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zenodo_upload
          cd zenodo_upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p "$PDF_ASSET" \
            -p "$DOCX_ASSET" \
            -p "$CHECKSUM_ASSET" \
            -p "$LICENSE_ASSET"
          for asset in "$PDF_ASSET" "$DOCX_ASSET"; do
            awk -v name="$asset" '$2 == name || $2 == "*" name {print}' "$CHECKSUM_ASSET" > selected.sha256
            test "$(wc -l < selected.sha256)" -eq 1
            sha256sum --strict -c selected.sha256
          done
          rm selected.sha256
          ls -lh

      - name: Verify Zenodo authentication without publication
        shell: python
        run: |
          import os
          import urllib.request
          import urllib.error
          request = urllib.request.Request(
              "https://zenodo.org/api/deposit/depositions?size=1",
              headers={"Authorization": "Bearer " + os.environ["ZENODO_TOKEN"],
                       "Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status != 200:
                      raise SystemExit("Zenodo authentication check failed.")
                  print("Zenodo authenticated read succeeded; no publication attempted.")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Zenodo authentication check failed: HTTP {error.code}")
