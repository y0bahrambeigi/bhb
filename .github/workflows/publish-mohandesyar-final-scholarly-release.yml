name: Publish MohandesYar final scholarly release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-mohandesyar-final-scholarly-release.yml"

permissions:
  contents: write

concurrency:
  group: mohandesyar-final-scholarly-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FINAL_TAG: "mohandesyar-ai-final-v2.0.0"
      REPORT_DOI: "10.6084/m9.figshare.33935692.v2"
      SOFTWARE_DOI: "10.6084/m9.figshare.33511795.v1"
      REPORT_SHA256: "c938de488c8b1e70eb8c7a53c38f30d5e719effda6256b5599f18c5ae8453e16"
      SOFTWARE_SHA256: "9635e7fc37fb4fa1dca6be169bbc678ae5c6d45113b4cb6cde9e4f3460f25173"

    steps:
      - name: Checkout final publication state
        uses: actions/checkout@v6

      - name: Verify scholarly metadata and report checksum
        shell: bash
        run: |
          set -euo pipefail
          PDF="mohandesyar-ai/publication/mohandesyar-ai-v2-technical-report.pdf"
          test -f "$PDF"
          echo "$REPORT_SHA256  $PDF" | sha256sum -c -
          grep -Fq "$REPORT_DOI" mohandesyar-ai/publication/index.html
          grep -Fq "$REPORT_DOI" mohandesyar-ai/publication/FIGSHARE_TECHNICAL_REPORT_METADATA.md
          grep -Fq "$SOFTWARE_DOI" mohandesyar-ai/CITATION.cff
          curl -fsSL -o /dev/null "https://doi.org/$REPORT_DOI"
          curl -fsSL -o /dev/null "https://doi.org/$SOFTWARE_DOI"

      - name: Download and verify frozen software release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download mohandesyar-ai-v2.0.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "mohandesyar-ai-2.0.0.zip" \
            --pattern "mohandesyar-ai-2.0.0.zip.sha256" \
            --dir dist
          echo "$SOFTWARE_SHA256  dist/mohandesyar-ai-2.0.0.zip" | sha256sum -c -

      - name: Assemble final scholarly release assets
        shell: bash
        run: |
          set -euo pipefail
          cp mohandesyar-ai/publication/mohandesyar-ai-v2-technical-report.pdf dist/
          cp mohandesyar-ai/publication/SHA256SUMS dist/technical-report-SHA256SUMS
          cp mohandesyar-ai/publication/FIGSHARE_TECHNICAL_REPORT_METADATA.md dist/
          cp mohandesyar-ai/CITATION.cff dist/MohandesYar-AI-CITATION.cff
          cat > dist/FINAL-RELEASE-SHA256SUMS <<EOF
          $SOFTWARE_SHA256  mohandesyar-ai-2.0.0.zip
          $REPORT_SHA256  mohandesyar-ai-v2-technical-report.pdf
          EOF
          (
            cd dist
            sha256sum -c FINAL-RELEASE-SHA256SUMS
          )

      - name: Publish final GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          report_doi = os.environ["REPORT_DOI"]
          software_doi = os.environ["SOFTWARE_DOI"]
          report_sha = os.environ["REPORT_SHA256"]
          software_sha = os.environ["SOFTWARE_SHA256"]
          notes = f"""# MohandesYar AI 2.0.0 — Final Scholarly Release

This release is the canonical distribution point that links the frozen
MohandesYar AI 2.0.0 software artifact with its independently citable
technical report.

## Canonical identifiers

- Software DOI: https://doi.org/{software_doi}
- Technical-report DOI: https://doi.org/{report_doi}
- Live PWA: https://y0bahrambeigi.github.io/bhb/mohandesyar-ai/
- Scholarly landing page: https://y0bahrambeigi.github.io/bhb/mohandesyar-ai/publication/

## Frozen assets and integrity

- `mohandesyar-ai-2.0.0.zip`
  - SHA-256: `{software_sha}`
- `mohandesyar-ai-v2-technical-report.pdf`
  - SHA-256: `{report_sha}`
- `FINAL-RELEASE-SHA256SUMS` verifies both primary assets.
- `MohandesYar-AI-CITATION.cff` supplies software citation metadata.
- `FIGSHARE_TECHNICAL_REPORT_METADATA.md` records the archival report metadata.

## Scope

MohandesYar AI 2.0.0 is an offline-first Persian RTL PWA for civil-engineering
field documentation with local project dossiers, image/video evidence,
optional geolocation, SHA-256 evidence fingerprints, backup/restore,
Persian A4 reporting, PWA installation, and offline relaunch.

The software archive and technical report are distinct research objects and
retain separate DOIs. This final release does not modify either frozen artifact.
"""
          with open("/tmp/release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(notes)
          PY

          if gh release view "$FINAL_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$FINAL_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "MohandesYar AI 2.0.0 — Final Scholarly Release" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$FINAL_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "MohandesYar AI 2.0.0 — Final Scholarly Release" \
              --notes-file /tmp/release-notes.md \
              dist/mohandesyar-ai-2.0.0.zip \
              dist/mohandesyar-ai-2.0.0.zip.sha256 \
              dist/mohandesyar-ai-v2-technical-report.pdf \
              dist/technical-report-SHA256SUMS \
              dist/FINAL-RELEASE-SHA256SUMS \
              dist/MohandesYar-AI-CITATION.cff \
              dist/FIGSHARE_TECHNICAL_REPORT_METADATA.md
          fi

          gh release view "$FINAL_TAG" --repo "${GITHUB_REPOSITORY}"
