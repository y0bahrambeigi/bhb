name: Publish IFD RC1 to Zenodo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ifd-rc1-zenodo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: "v1.0.0-rc1"
      VERSION: "1.0.0-rc1"
      TITLE: "IFD Seismic Optimization Framework: Source-Constrained Modeling, Independent Verification, and BMPOA Integration"
      RELEASE_URL: "https://github.com/y0bahrambeigi/bhb/releases/tag/v1.0.0-rc1"
      ZIP_ASSET: "IFD_Seismic_Optimization_Framework_v1.0.0-rc1.zip"
      PREPRINT_ASSET: "IFD_Framework_Preprint_v1.0.0-rc1.md"
      CHECKSUM_ASSET: "IFD_Seismic_Optimization_Framework_v1.0.0-rc1.zip.sha256"
      ORCID: "0000-0002-3421-8679"
      AFFILIATION: "Civil Engineering, Islamic Azad University, Mahabad Branch, Mahabad, Iran"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: v1.0.0-rc1

      - name: Download exact GitHub release assets
        run: |
          set -euo pipefail
          mkdir -p zenodo_upload
          cd zenodo_upload
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             -p "$ZIP_ASSET"             -p "$PREPRINT_ASSET"             -p "$CHECKSUM_ASSET"
          echo "Downloaded release assets:"
          ls -lh
          sha256sum "$ZIP_ASSET"

      - name: Guarded Zenodo deposit creation and publication
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ.get("ZENODO_TOKEN", "").strip()
          if not token:
              raise SystemExit(
                  "ZENODO_TOKEN is not configured; no Zenodo action was taken."
              )

          title = os.environ["TITLE"]
          version = os.environ["VERSION"]
          release_url = os.environ["RELEASE_URL"]
          zip_asset = os.environ["ZIP_ASSET"]
          preprint_asset = os.environ["PREPRINT_ASSET"]
          checksum_asset = os.environ["CHECKSUM_ASSET"]
          orcid = os.environ["ORCID"]
          affiliation = os.environ["AFFILIATION"]
          upload_dir = Path("zenodo_upload")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "IFD-Seismic-Optimization-Zenodo-Publisher/1.0",
          }

          def request_json(url, method="GET", payload=None, raw=None, extra_headers=None, timeout=120):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              data = raw
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read()
                      parsed = json.loads(body.decode("utf-8")) if body else {}
                      return resp.status, parsed
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  raise SystemExit(f"Zenodo API {method} {url} failed HTTP {e.code}: {body}")

          # Guard against duplicate title+version deposits.
          status, deposits = request_json("https://zenodo.org/api/deposit/depositions?size=100")
          if status != 200 or not isinstance(deposits, list):
              raise SystemExit("Could not safely list existing Zenodo depositions.")

          matches = []
          for dep in deposits:
              md = dep.get("metadata") or {}
              if md.get("title") == title and str(md.get("version", "")) == version:
                  matches.append(dep)

          if len(matches) > 1:
              raise SystemExit(
                  f"Found {len(matches)} Zenodo deposits with identical title+version; refusing duplicate publication."
              )

          if len(matches) == 1 and (matches[0].get("submitted") is True or matches[0].get("state") == "done"):
              dep = matches[0]
              result = {
                  "status": "already-published",
                  "doi": dep.get("doi") or (dep.get("metadata") or {}).get("doi"),
                  "doi_url": dep.get("doi_url"),
                  "record_url": dep.get("record_url") or (dep.get("links") or {}).get("record"),
                  "record_id": dep.get("record_id") or dep.get("id"),
              }
              print("ZENODO_ALREADY_PUBLISHED")
              print(json.dumps(result, indent=2))
              Path("zenodo_result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
              sys.exit(0)

          if len(matches) == 1:
              dep = matches[0]
              print("Reusing existing matching unpublished draft:", dep.get("id"))
          else:
              create_status, dep = request_json(
                  "https://zenodo.org/api/deposit/depositions",
                  method="POST",
                  payload={},
              )
              if create_status != 201:
                  raise SystemExit(f"Unexpected Zenodo draft create status {create_status}")
              print("Created new Zenodo draft:", dep.get("id"))

          dep_id = dep["id"]

          metadata = {
              "metadata": {
                  "title": title,
                  "upload_type": "software",
                  "description": (
                      "Release candidate of a reproducible computational framework for seismic optimization "
                      "of inerter-friction-damper-controlled structures. The release includes MATLAB MDOF "
                      "response analysis, mixed-variable BMPOA integration under equal evaluator budgets, "
                      "an independent Python verification implementation, provenance controls, and a "
                      "methods preprint source. This software release does not claim exact experimental "
                      "reproduction of Hu et al. (2026); source-specific constitutive equations and "
                      "experimental validation remain explicitly gated."
                  ),
                  "creators": [{
                      "name": "Bahram Beigi, Yousef",
                      "orcid": orcid,
                      "affiliation": affiliation,
                  }],
                  "publication_date": "2026-09-25",
                  "version": version,
                  "access_right": "open",
                  "license": "MIT",
                  "keywords": [
                      "inerter friction damper",
                      "seismic optimization",
                      "structural control",
                      "BMPOA",
                      "reproducibility",
                      "MATLAB",
                      "nonlinear dynamics"
                  ],
                  "related_identifiers": [{
                      "identifier": release_url,
                      "relation": "isIdenticalTo",
                      "scheme": "url"
                  }]
              }
          }

          update_status, dep = request_json(
              f"https://zenodo.org/api/deposit/depositions/{dep_id}",
              method="PUT",
              payload=metadata,
          )
          if update_status != 200:
              raise SystemExit(f"Unexpected metadata update status {update_status}")

          bucket = (dep.get("links") or {}).get("bucket")
          if not bucket:
              raise SystemExit("Zenodo draft did not expose a file bucket.")

          # Upload exact GitHub Release assets. Re-uploading the same filename is safe for an unpublished draft.
          existing_names = {
              f.get("filename") or f.get("name")
              for f in (dep.get("files") or [])
          }
          for filename in (zip_asset, preprint_asset, checksum_asset):
              path = upload_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Missing downloaded GitHub Release asset: {path}")
              target = bucket.rstrip("/") + "/" + urllib.parse.quote(filename)
              with path.open("rb") as fp:
                  upload_headers = dict(headers)
                  upload_headers["Content-Type"] = "application/octet-stream"
                  req = urllib.request.Request(target, data=fp.read(), headers=upload_headers, method="PUT")
                  try:
                      with urllib.request.urlopen(req, timeout=180) as resp:
                          if resp.status not in (200, 201):
                              raise SystemExit(f"Unexpected upload status {resp.status} for {filename}")
                          resp.read()
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      raise SystemExit(f"Upload failed for {filename}: HTTP {e.code}: {body}")
              print("Uploaded:", filename)

          # Re-fetch and verify metadata/files before irreversible publish.
          _, dep = request_json(f"https://zenodo.org/api/deposit/depositions/{dep_id}")
          md = dep.get("metadata") or {}
          failures = []
          if md.get("title") != title:
              failures.append("title mismatch")
          if md.get("upload_type") != "software":
              failures.append("upload_type is not software")
          if str(md.get("version", "")) != version:
              failures.append("version mismatch")
          creators = md.get("creators") or []
          if not any(
              (c.get("orcid") or "").replace("https://orcid.org/", "") == orcid
              and c.get("name") == "Bahram Beigi, Yousef"
              for c in creators
          ):
              failures.append("creator/ORCID mismatch")
          names = {
              f.get("filename") or f.get("name")
              for f in (dep.get("files") or [])
          }
          for required in (zip_asset, preprint_asset, checksum_asset):
              if required not in names:
                  failures.append(f"missing file {required}")

          if failures:
              print("Zenodo publication gate FAILED:")
              for item in failures:
                  print(" -", item)
              raise SystemExit("No publish action was taken.")

          reserved = (md.get("prereserve_doi") or {}).get("doi")
          print("Reserved DOI:", reserved)

          publish_url = (dep.get("links") or {}).get("publish") or               f"https://zenodo.org/api/deposit/depositions/{dep_id}/actions/publish"
          pub_status, published = request_json(publish_url, method="POST")
          if pub_status not in (200, 201, 202):
              raise SystemExit(f"Unexpected Zenodo publish status {pub_status}")

          doi = published.get("doi") or (published.get("metadata") or {}).get("doi") or reserved
          doi_url = published.get("doi_url") or (f"https://doi.org/{doi}" if doi else None)
          record_url = published.get("record_url") or (published.get("links") or {}).get("record")
          result = {
              "status": "published",
              "doi": doi,
              "doi_url": doi_url,
              "record_url": record_url,
              "record_id": published.get("record_id") or published.get("id") or dep_id,
          }
          Path("zenodo_result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print("ZENODO_PUBLISH_SUCCESS")
          print(json.dumps(result, indent=2))

      - name: Verify public DOI and save result
        if: always()
        shell: python
        run: |
          import json
          import urllib.request
          from pathlib import Path

          p = Path("zenodo_result.json")
          if not p.exists():
              raise SystemExit("No Zenodo result file exists; publication did not complete safely.")
          result = json.loads(p.read_text(encoding="utf-8"))
          doi = result.get("doi")
          if not doi:
              raise SystemExit("Zenodo result contains no DOI.")
          req = urllib.request.Request(
              f"https://doi.org/{doi}",
              headers={"User-Agent": "IFD-Seismic-Optimization-DOI-Verifier/1.0"}
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print("HTTP:", getattr(resp, "status", 200))
              print("Resolved URL:", resp.geturl())
              if "zenodo.org" not in resp.geturl().lower():
                  raise SystemExit("DOI did not resolve to Zenodo.")

      - name: Upload Zenodo result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ifd-zenodo-result
          path: zenodo_result.json
          if-no-files-found: warn
