name: Publish MohandesYar technical report to Figshare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mohandesyar-technical-report-figshare.yml"
      - "mohandesyar-ai/scripts/publish_figshare_technical_report.py"
      - "mohandesyar-ai/publication/mohandesyar-ai-v2-technical-report.pdf"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohandesyar-technical-report-figshare
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@v6

      - name: Require Figshare API token
        shell: bash
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${FIGSHARE_TOKEN}" ]]; then
            echo "FIGSHARE_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Verify PDF, reserve DOI, and publish technical report
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: python mohandesyar-ai/scripts/publish_figshare_technical_report.py
