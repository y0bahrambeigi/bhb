name: Attach IFD RC1 Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-ifd-rc1-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target release commit
        uses: actions/checkout@v6
        with:
          ref: 4791fa90ae8c2e4ba8edd94384710b9ef2313c42

      - name: Build clean release archive and checksum
        run: |
          set -euo pipefail
          ZIP="IFD_Seismic_Optimization_Framework_v1.0.0-rc1.zip"
          zip -r "$ZIP" ifd-seismic-optimization >/dev/null
          sha256sum "$ZIP" > "$ZIP.sha256"
          cp ifd-seismic-optimization/manuscript/PREPRINT.md IFD_Framework_Preprint_v1.0.0-rc1.md

      - name: Attach assets to GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.0.0-rc1             IFD_Seismic_Optimization_Framework_v1.0.0-rc1.zip             IFD_Seismic_Optimization_Framework_v1.0.0-rc1.zip.sha256             IFD_Framework_Preprint_v1.0.0-rc1.md             --repo "$GITHUB_REPOSITORY"             --clobber
