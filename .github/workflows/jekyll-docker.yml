name: Deploy Python Academy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "academy/**"
      - ".github/workflows/jekyll-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "python-academy-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "314.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare self-hosted static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/pyodide
          rsync -a academy/ _site/

          base_url="https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full"
          for file in pyodide.js pyodide.asm.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl --fail --location --retry 3 --silent --show-error \
              "${base_url}/${file}" --output "_site/pyodide/${file}"
            test -s "_site/pyodide/${file}"
          done

          find _site -type f ! -name FILE_CHECKSUMS.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > _site/FILE_CHECKSUMS.sha256

      - name: Smoke-test Python runtime
        shell: bash
        working-directory: _site
        run: |
          node - <<'NODE'
          const { loadPyodide } = require('./pyodide/pyodide.js');
          (async () => {
            const pyodide = await loadPyodide({ indexURL: `${process.cwd()}/pyodide/` });
            const result = await pyodide.runPythonAsync('sum([12.5, 18.2, 9.8, 21.4])');
            if (result !== 61.9) throw new Error(`Unexpected Python result: ${result}`);
            console.log(`Pyodide smoke test passed: ${result}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
