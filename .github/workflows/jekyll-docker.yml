name: Validate Python Academy

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "404.html"
      - "assets/**"
      - "academy/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/jekyll-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "python-academy-validation"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "314.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s assets/page-CLR9xq8Z.js
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          node --check assets/page-CLR9xq8Z.js

      - name: Download pinned Pyodide runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/pyodide"
          mkdir -p "$runtime_dir"
          base_url="https://cdn.jsdelivr.net/pyodide/v${PYODIDE_VERSION}/full"
          for file in pyodide.js pyodide.asm.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl --fail --location --retry 3 --silent --show-error \
              "${base_url}/${file}" --output "${runtime_dir}/${file}"
            test -s "${runtime_dir}/${file}"
          done

      - name: Smoke-test Python runtime
        shell: bash
        run: |
          PYODIDE_DIR="${RUNNER_TEMP}/pyodide" node - <<'NODE'
          const { loadPyodide } = require(`${process.env.PYODIDE_DIR}/pyodide.js`);
          (async () => {
            const pyodide = await loadPyodide({ indexURL: `${process.env.PYODIDE_DIR}/` });
            const result = await pyodide.runPythonAsync('sum([12.5, 18.2, 9.8, 21.4])');
            if (result !== 61.9) throw new Error(`Unexpected Python result: ${result}`);
            console.log(`Pyodide smoke test passed: ${result}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
