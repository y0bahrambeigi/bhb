name: Publish IFD RC1 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ifd-rc1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create tag and GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-rc1
          TARGET_SHA: 4791fa90ae8c2e4ba8edd94384710b9ef2313c42
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "IFD Seismic Optimization Framework v1.0.0-rc1"             --notes-file ifd-seismic-optimization/GITHUB_RELEASE_BODY.md             --prerelease
